apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: animal-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wailwinphone/text-website.git
    targetRevision: HEAD
    path: manifests/farm
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: animal-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true